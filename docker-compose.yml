services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitmind
      POSTGRES_USER: gitmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitmind-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitmind -d gitmind"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gitmind
      SPRING_DATASOURCE_USERNAME: gitmind
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gitmind-local}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
  frontend:
    build: ./app
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres-data:


