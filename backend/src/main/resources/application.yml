spring:
  application:
    name: gitmind-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gitmind}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

github:
  api:
    base-url: https://api.github.com
    graphql-url: https://api.github.com/graphql
    user-agent: GitMind-AI/1.0
    connect-timeout: 10000
    read-timeout: 30000
    # Personal access token (classic, no scopes needed for public data) or
    # fine-grained token. Required for the contribution heatmap (GraphQL),
    # and raises REST rate limit from 60/hr to 5000/hr.
    token: ${GITHUB_TOKEN:}
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent}

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
ai:
  provider: ${AI_PROVIDER:auto}

# --- pre-caching (in-memory, TTL-based) ---
app:
  cache:
    fresh-ttl-minutes: 10      # how long a result is served without re-hitting GitHub/Gemini
    stale-ttl-hours: 6         # how long a "last known good" result stays available for fail-open
    max-entries: 2000

  # --- rolling-window rate limiter (protects our own API + the shared GitHub token) ---
  rate-limit:
    enabled: true
    window-seconds: 60
    max-requests-per-window: 30   # per client IP, per rolling 60s window

# --- circuit breaker + retry with exponential backoff ---
resilience4j:
  circuitbreaker:
    instances:
      githubApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 8s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      geminiApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      githubApi:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - com.gitmind.exception.GitHubApiException
      geminiApi:
        max-attempts: 1
        wait-duration: 400ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.gitmind: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}


